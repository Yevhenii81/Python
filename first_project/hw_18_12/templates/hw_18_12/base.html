<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Бібліотека</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            background: #f7f7f7;
        }
        nav {
            background: #222;
            padding: 10px;
        }
        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'library_home' %}">Головна</a>
    <a href="{% url 'book_list' %}">Книги</a>
    <a href="{% url 'reader_list' %}">Читачі</a>
</nav>

<div class="box">
    {% block content %}{% endblock %}
</div>

</body>
</html>
